kind = "web"
previewPath = "/"
title = "Glow AI"
version = "1.0.0"
id = "artifacts/glow-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/glow-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glow-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/glow-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
